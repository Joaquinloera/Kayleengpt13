name: KayleenGPT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KayleenGPT
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify JavaScript
        run: |
          node --check app.js
          node --check netlify/functions/_core/compute-router.js
          node --check netlify/functions/_core/compute-adapters/classical.js
          node --check netlify/functions/_core/compute-adapters/ibm-quantum.js
          node --check netlify/functions/_core/compute-adapters/cortical-cl1.js

      - name: KayleenGPT checkpoint
        run: echo "KayleenGPT source verification passed."
